[build]
  command = "pip install -r requirements.txt"
  functions = "functions"
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "python"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "python app.py"
  port = 5000

[env.production]
  FLASK_ENV = "production"
  DEBUG = "False"
